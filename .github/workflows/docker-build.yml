---
name: docker-build
on:
  push:
    branches:
      - 'claude/laughing-heisenberg-e7n54k'
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (default: branch name or sha)'
        required: false
        type: string
      push:
        description: 'Whether to push the image'
        required: false
        type: boolean
        default: true
    outputs:
      image_ref:
        description: 'Full image reference pushed to ghcr'
        value: ${{ jobs.build.outputs.image_ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A cold build takes ~3h of runner time; don't let pushes pile up overlapping
# runs. Newer pushes to the same ref cancel the in-flight build.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      # A cold build of the full redpanda binary is heavy: the link step is
      # RAM-hungry and the build tree is tens of GB. A stock runner can hit the
      # OOM killer or run out of disk during the final link/packaging actions,
      # which then fail by SIGKILL with no stderr (Bazel just says "failed to
      # build"). Free disk + add swap defensively; the df/free output confirms
      # headroom on each run.
      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          echo "After cleanup:"
          df -h /

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Bazelisk
        run: |
          mkdir -p ~/bin
          wget -O ~/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x ~/bin/bazel
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo ./bazel/install-deps.sh

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Log in to ghcr.io
        if: inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Determine image tag
        id: meta
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref_type }}" == "branch" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.sha }}"
          fi
          TAG=$(echo "$TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build OCI image with Bazel
        run: |
          unset CI
          # Reserve RAM headroom so Bazel doesn't schedule several memory-heavy
          # link actions concurrently and push the box into the OOM killer.
          bazel build \
            --spawn_strategy=local \
            --verbose_failures \
            --lockfile_mode=update \
            --local_ram_resources=HOST_RAM*.8 \
            //bazel/packaging:image
          echo "Post-build resources:"
          df -h /
          free -h

      - name: Push image to ghcr.io
        if: inputs.push != false
        run: |
          crane push bazel-bin/bazel/packaging/image "${{ steps.meta.outputs.image_ref }}"

          if [[ "${{ github.ref_name }}" == "dev" ]] || [[ "${{ github.ref_name }}" == "main" ]]; then
            crane push bazel-bin/bazel/packaging/image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
