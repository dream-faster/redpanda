---
name: docker-build
on:
  push:
    branches:
      - 'claude/laughing-heisenberg-e7n54k'
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (default: branch name or sha)'
        required: false
        type: string
      push:
        description: 'Whether to push the image'
        required: false
        type: boolean
        default: true
    outputs:
      image_ref:
        description: 'Full image reference pushed to ghcr'
        value: ${{ jobs.build.outputs.image_ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A cold build takes ~3h of runner time; don't let pushes pile up overlapping
# runs. Newer pushes to the same ref cancel the in-flight build.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubicloud-standard-4
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      # A cold build of the full redpanda binary is heavy: the link step is
      # RAM-hungry and the default output base on / only has ~14GB free, which
      # a full build exhausts. Redirect Bazel output to /mnt (large ephemeral
      # volume, typically 60GB+), add swap, and free preinstalled tooling to
      # give the root filesystem headroom for OS/toolchain files.
      - name: Prepare build environment
        run: |
          echo "=== disk before cleanup ==="
          df -h
          # Free tooling we don't need to reclaim root filesystem space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          # Swap on /mnt keeps the OOM killer away during parallel linking.
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Bazel output base on /mnt where there is ample disk space.
          sudo mkdir -p /mnt/bazel-output
          sudo chown "$(id -u):$(id -g)" /mnt/bazel-output
          echo "=== disk after cleanup ==="
          df -h
          free -h

      - name: Install Bazelisk
        run: |
          mkdir -p ~/bin
          wget -O ~/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x ~/bin/bazel
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo ./bazel/install-deps.sh

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Log in to ghcr.io
        if: inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Determine image tag
        id: meta
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref_type }}" == "branch" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.sha }}"
          fi
          TAG=$(echo "$TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build OCI image with Bazel
        run: |
          unset CI
          # --local_resources=memory replaces the --local_ram_resources flag
          # that Bazel removed in 8.x. Reserve 20% RAM headroom so Bazel
          # doesn't schedule several memory-heavy link/compile actions at once
          # and trip the OOM killer (the original silent build failure). Quoted
          # so the shell doesn't glob-expand the '*'.
          bazel \
            --output_base=/mnt/bazel-output \
            build \
            --config=release \
            --spawn_strategy=local \
            --verbose_failures \
            --lockfile_mode=update \
            '--local_resources=memory=HOST_RAM*.8' \
            //bazel/packaging:image
          echo "=== post-build resources ==="
          df -h
          free -h

      - name: Push image to ghcr.io
        if: inputs.push != false
        run: |
          # bazel-bin/ is a symlink Bazel updates in the workspace root;
          # it resolves correctly even with a custom --output_base.
          crane push bazel-bin/bazel/packaging/image "${{ steps.meta.outputs.image_ref }}"

          if [[ "${{ github.ref_name }}" == "dev" ]] || [[ "${{ github.ref_name }}" == "main" ]]; then
            crane push bazel-bin/bazel/packaging/image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
