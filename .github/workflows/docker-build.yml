---
name: docker-build
on:
  push:
    branches:
      - 'claude/laughing-heisenberg-e7n54k'
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (default: branch name or sha)'
        required: false
        type: string
      push:
        description: 'Whether to push the image'
        required: false
        type: boolean
        default: true
    outputs:
      image_ref:
        description: 'Full image reference pushed to ghcr'
        value: ${{ jobs.build.outputs.image_ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Bazelisk
        run: |
          mkdir -p ~/bin
          wget -O ~/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x ~/bin/bazel
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo ./bazel/install-deps.sh

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Log in to ghcr.io
        if: inputs.push != false
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.ref_type }}" == "branch" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.sha }}"
          fi
          TAG=$(echo "$TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build redpanda package tarball
        run: |
          unset CI
          bazel build --spawn_strategy=local //bazel/packaging:redpanda_tar

      - name: Build and push Docker image
        if: inputs.push != false
        run: |
          mkdir -p /tmp/image/opt/redpanda
          tar xzf bazel-bin/bazel/packaging/redpanda.tar.gz -C /tmp/image/opt/redpanda

          cat > /tmp/image/Dockerfile <<'DOCKERFILE'
          FROM gcr.io/distroless/cc-debian12
          COPY opt/ /opt/
          ENTRYPOINT ["/opt/redpanda/bin/rpk"]
          CMD ["redpanda", "start", "--overprovisioned"]
          EXPOSE 9092 8081 8082 9644
          DOCKERFILE

          docker build -t "${{ steps.meta.outputs.image_ref }}" /tmp/image
          docker push "${{ steps.meta.outputs.image_ref }}"

          if [[ "${{ github.ref_name }}" == "dev" ]] || [[ "${{ github.ref_name }}" == "main" ]]; then
            docker tag "${{ steps.meta.outputs.image_ref }}" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
