---
name: docker-build
on:
  push:
    branches:
      - 'claude/laughing-heisenberg-e7n54k'
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (default: commit sha)'
        required: false
        type: string
    outputs:
      image_ref:
        description: 'Full image reference pushed to ghcr'
        value: ${{ jobs.build.outputs.image_ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A cold build takes ~3h of runner time; don't let pushes pile up overlapping
# runs. Newer pushes to the same ref cancel the in-flight build.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubicloud-standard-4
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      # A cold build of the full redpanda binary is heavy: the link step is
      # RAM-hungry and the default output base on / only has ~14GB free, which
      # a full build exhausts. Redirect Bazel output to /mnt (large ephemeral
      # volume, typically 60GB+), add swap, and free preinstalled tooling to
      # give the root filesystem headroom for OS/toolchain files.
      - name: Prepare build environment
        run: |
          echo "=== disk before cleanup ==="
          df -h
          # Free tooling we don't need to reclaim root filesystem space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          # Swap on /mnt keeps the OOM killer away during the RAM-heavy final
          # link. /mnt has 60GB+, so size it generously as a backstop.
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Bazel output base on /mnt where there is ample disk space.
          sudo mkdir -p /mnt/bazel-output
          sudo chown "$(id -u):$(id -g)" /mnt/bazel-output
          echo "=== disk after cleanup ==="
          df -h
          free -h
          # linux-sandbox needs unprivileged user namespaces. The build runs
          # non-sandboxed only because an earlier commit assumed these runners
          # lack the capability; probe it directly so the log says definitively
          # whether sandboxing (the real fix for the liburing hermeticity error)
          # can run here.
          echo "=== sandbox capability ==="
          echo "unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"
          if unshare --user --map-root-user true 2>/dev/null; then
            echo "unprivileged user namespaces: WORKING (linux-sandbox should run)"
          else
            echo "unprivileged user namespaces: BLOCKED (linux-sandbox will fail)"
          fi

      - name: Install Bazelisk
        run: |
          mkdir -p ~/bin
          wget -O ~/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x ~/bin/bazel
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo ./bazel/install-deps.sh

      - name: Mount Bazel cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      - name: Determine image tag
        id: meta
        run: |
          SHA_TAG="${{ github.sha }}"
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${SHA_TAG}"
          fi
          TAG=$(echo "$TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build OCI image with Bazel
        run: |
          unset CI
          # Prefer the sandbox, fall back to local only for actions that can't
          # sandbox. The build used to fail with a Bazel hermeticity error --
          # "undeclared inclusion(s) ... config-host.h" -- on liburing's
          # generated, force-included config-host.h (see
          # bazel/thirdparty/liburing.patch). That only trips under
          # non-sandboxed (--spawn_strategy=local) execution, where strict .d
          # include validation can't match the generated header's path; redpanda
          # is designed to build sandboxed. The earlier OOM theory was wrong --
          # the runner had 31Gi RAM + 19Gi swap and every compile succeeded; the
          # lone liburing error was just buried ~2000 lines above the log tail.
          #
          # --local_resources=memory (replacing Bazel 8.x's removed
          # --local_ram_resources) still reserves 20% RAM headroom so the
          # RAM-heavy final link of the full-debug redpanda binary isn't
          # over-scheduled. Quoted so the shell doesn't glob-expand the '*'.
          bazel \
            --output_base=/mnt/bazel-output \
            build \
            --config=release \
            --spawn_strategy=sandboxed,local \
            --verbose_failures \
            --lockfile_mode=update \
            '--local_resources=memory=HOST_RAM*.8' \
            //bazel/packaging:image
          echo "=== post-build resources ==="
          df -h
          free -h

      - name: Push image to ghcr.io
        run: |
          # Bazel's OCI image directory stores layer blobs as symlinks into
          # its content-addressable store; crane refuses to read symlinked
          # blobs ("layout blob ... is a symlink"). Dereference into a temp
          # directory with cp -rL first, then push the materialized layout.
          OCI_IMAGE=$(mktemp -d)/image
          cp -rL bazel-bin/bazel/packaging/image "$OCI_IMAGE"

          # Build a tar layer with the tools required by Helm lifecycle scripts
          # and startup probes (bash, curl, wget, grep, sed, coreutils for
          # tee/touch/sleep, and ca-certificates for TLS).  bash/grep/sed/
          # coreutils are already present in debian:bookworm-slim as required
          # packages, so the dpkg diff ensures only genuinely new files (curl,
          # wget, ca-certificates and their deps) end up in the delta layer.
          # Run inside the same debian:bookworm-slim base so lib versions match.
          docker run --rm debian:bookworm-slim sh -c '
            set -e
            apt-get update -qq
            dpkg-query -W --showformat='"'"'${Package}\n'"'"' | sort > /before.txt
            apt-get install -y --no-install-recommends \
              bash \
              ca-certificates \
              coreutils \
              curl \
              grep \
              sed \
              wget
            dpkg-query -W --showformat='"'"'${Package}\n'"'"' | sort > /after.txt
            comm -13 /before.txt /after.txt | xargs dpkg -L | grep "^/" | sort -u | \
              tar -c --no-recursion -T - 2>/dev/null
          ' > /tmp/utils-layer.tar

          # Append the utilities layer and push in one crane operation.
          crane append \
            --base oci://"$OCI_IMAGE" \
            --new_layer /tmp/utils-layer.tar \
            -t "${{ steps.meta.outputs.image_ref }}"

          if [[ "${{ github.ref_name }}" == "dev" ]] || [[ "${{ github.ref_name }}" == "main" ]]; then
            crane tag "${{ steps.meta.outputs.image_ref }}" latest
          fi
