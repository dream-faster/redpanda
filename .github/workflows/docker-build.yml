---
name: docker-build
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (default: commit sha)'
        required: false
        type: string
      stock_image:
        description: 'Image the upgrade test rolls FROM (default: the deployed dedup build; set empty to fall back to the newest public v26.2.x, which has no dedup and skips the dedup leg)'
        required: false
        type: string
        default: 'ghcr.io/dream-faster/redpanda:085657d38360db6808462a096274b4aabb23b1df'
  workflow_call:
    inputs:
      image_tag:
        description: 'Tag for the Docker image (default: commit sha)'
        required: false
        type: string
      stock_image:
        description: 'Image the upgrade test rolls FROM (default: the deployed dedup build; set empty to fall back to the newest public v26.2.x, which has no dedup and skips the dedup leg)'
        required: false
        type: string
        default: 'ghcr.io/dream-faster/redpanda:085657d38360db6808462a096274b4aabb23b1df'
    outputs:
      image_ref:
        description: 'Full image reference pushed to ghcr'
        value: ${{ jobs.build.outputs.image_ref }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# A cold build takes ~3h of runner time; don't let pushes pile up overlapping
# runs. Newer pushes to the same ref cancel the in-flight build.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubicloud-standard-4
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      # A cold build of the full redpanda binary is heavy: the link step is
      # RAM-hungry and the default output base on / only has ~14GB free, which
      # a full build exhausts. Redirect Bazel output to /mnt (large ephemeral
      # volume, typically 60GB+), add swap, and free preinstalled tooling to
      # give the root filesystem headroom for OS/toolchain files.
      - name: Prepare build environment
        run: |
          echo "=== disk before cleanup ==="
          df -h
          # Free tooling we don't need to reclaim root filesystem space.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          # Swap on /mnt keeps the OOM killer away during the RAM-heavy final
          # link. /mnt has 60GB+, so size it generously as a backstop.
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          # Bazel output base and caches on /mnt where there is ample disk
          # space.
          sudo mkdir -p /mnt/bazel-output /mnt/bazel-repo-cache /mnt/bazel-disk-cache
          sudo chown "$(id -u):$(id -g)" /mnt/bazel-output /mnt/bazel-repo-cache \
            /mnt/bazel-disk-cache
          echo "=== disk after cleanup ==="
          df -h
          free -h
          # linux-sandbox needs unprivileged user namespaces; probe it so the
          # log says definitively whether sandboxing can run here.
          echo "=== sandbox capability ==="
          echo "unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo n/a)"
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo n/a)"
          if unshare --user --map-root-user true 2>/dev/null; then
            echo "unprivileged user namespaces: WORKING (linux-sandbox should run)"
          else
            echo "unprivileged user namespaces: BLOCKED (linux-sandbox will fail)"
          fi

      - name: Install Bazelisk
        run: |
          mkdir -p ~/bin
          wget -O ~/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x ~/bin/bazel
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install system dependencies
        run: sudo ./bazel/install-deps.sh

      # The caches below are shared with unit-tests.yml: same paths, same key
      # scheme, same host toolchain and the same --config=release
      # --config=unity, so the core objects either workflow compiles are cache
      # hits for the other. Keep the two in step when changing either.
      - name: Restore bazelisk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazelisk
          key: bazelisk-${{ runner.os }}-${{ hashFiles('.bazelversion') }}

      - name: Restore Bazel repository cache
        uses: actions/cache@v4
        with:
          path: /mnt/bazel-repo-cache
          key: bazel-release-repo-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock') }}
          restore-keys: |
            bazel-release-repo-${{ runner.os }}-

      # Cache keys are immutable and unit-tests (which runs on every push) can
      # be running at the same time, so each saves under its own name. Restore
      # prefers this workflow's newest entry (it holds rpk and the packaging
      # outputs too) and falls back to unit-tests', which still covers the bulk
      # of the compile.
      - name: Restore Bazel disk cache
        id: disk-cache
        uses: actions/cache/restore@v4
        with:
          path: /mnt/bazel-disk-cache
          key: bazel-release-unity-disk-${{ runner.os }}-image-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            bazel-release-unity-disk-${{ runner.os }}-image-${{ github.ref_name }}-
            bazel-release-unity-disk-${{ runner.os }}-unit-tests-${{ github.ref_name }}-
            bazel-release-unity-disk-${{ runner.os }}-image-
            bazel-release-unity-disk-${{ runner.os }}-

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        # image_tag reaches the script through the environment instead of
        # ${{ }}. Expression interpolation is substituted into the script
        # source before bash parses it, so a crafted workflow_dispatch or
        # workflow_call input would run as shell code in a job that holds
        # packages: write and the registry token. The sanitising sed below
        # cannot prevent that -- it runs on a value that has already been
        # pasted in as code.
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          SHA_TAG: ${{ github.sha }}
        run: |
          if [[ -n "$INPUT_IMAGE_TAG" ]]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            TAG="$SHA_TAG"
          fi
          TAG=$(echo "$TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build OCI image with Bazel
        run: |
          unset CI
          # Prefer the sandbox, fall back to local only for actions that can't
          # sandbox. Non-sandboxed (--spawn_strategy=local) execution trips a
          # hermeticity error on liburing's generated, force-included
          # config-host.h (see bazel/thirdparty/liburing.patch); redpanda is
          # designed to build sandboxed.
          #
          # --local_resources=memory reserves 20% RAM headroom so the RAM-heavy
          # final link of the redpanda binary isn't over-scheduled. Quoted so
          # the shell doesn't glob-expand the '*'.
          #
          # --config=release --config=unity must match unit-tests.yml: a
          # different --config is a different Bazel configuration and so a
          # different set of cache keys, which would make the shared disk
          # cache useless. unity compiles each library as a few multi-file
          # translation units (see redpanda_cc_library in bazel/build.bzl);
          # scheduled-default-build.yml covers the default build.
          bazel \
            --output_base=/mnt/bazel-output \
            build \
            --config=release \
            --config=unity \
            --repository_cache=/mnt/bazel-repo-cache \
            --disk_cache=/mnt/bazel-disk-cache \
            --spawn_strategy=sandboxed,local \
            --verbose_failures \
            --lockfile_mode=update \
            '--local_resources=memory=HOST_RAM*.8' \
            //bazel/packaging:image
          echo "=== post-build resources ==="
          df -h
          free -h

      - name: Push image to ghcr.io
        run: |
          FINAL_REF="${{ steps.meta.outputs.image_ref }}"

          # Copy the Bazel-built redpanda package into a staging directory
          # that serves as the Docker build context. The tarball extracts to
          # /opt/redpanda/, /etc/redpanda/, and /var/lib/redpanda/data/.
          STAGING=$(mktemp -d)
          cp bazel-bin/bazel/packaging/redpanda_nonroot.tar.gz "$STAGING/"

          # Build the image from a plain Dockerfile: install bash and Helm
          # lifecycle tools first (apt-get), then ADD the redpanda tarball
          # (Docker auto-extracts .tar.gz into the destination directory).
          # -f - reads the Dockerfile from stdin; the positional $STAGING path
          # is the build context, so ADD can reference the tarball.
          # <<'EOF' prevents bash from expanding $(...) inside the Dockerfile.
          docker build -t "$FINAL_REF" -f - "$STAGING" <<'EOF'
          FROM debian:bookworm-slim
          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                bash ca-certificates coreutils curl grep sed tzdata wget && \
              rm -rf /var/lib/apt/lists/*
          RUN groupadd --gid 65532 nonroot && \
              useradd --uid 65532 --gid 65532 --no-create-home --shell /usr/sbin/nologin nonroot
          ADD redpanda_nonroot.tar.gz /
          RUN chown -R 65532:65532 /etc/redpanda /var/lib/redpanda /opt/redpanda
          EXPOSE 8081 8082 9092 9644
          VOLUME ["/var/lib/redpanda/data"]
          LABEL org.opencontainers.image.authors="Redpanda Data <hi@redpanda.com>"
          USER 65532:65532
          ENTRYPOINT ["/opt/redpanda/bin/rpk"]
          CMD ["redpanda", "start", "--overprovisioned"]
          EOF
          docker push "$FINAL_REF"

          if [[ "${{ github.ref_name }}" == "dev" ]] || [[ "${{ github.ref_name }}" == "main" ]]; then
            docker tag "$FINAL_REF" "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            docker push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi

      # Bazel bumps the mtime of every disk cache entry it reads, so entries
      # untouched for a few days are the ones no recent build has needed.
      - name: Trim the disk cache
        if: ${{ !cancelled() && steps.disk-cache.outcome == 'success' && steps.disk-cache.outputs.cache-hit != 'true' }}
        run: |
          SIZE=$(du -sm /mnt/bazel-disk-cache | cut -f1)
          echo "disk cache: ${SIZE}MB"
          if [[ "$SIZE" -gt 12000 ]]; then
            find /mnt/bazel-disk-cache -type f -mtime +3 -delete || true
            echo "trimmed to $(du -sm /mnt/bazel-disk-cache | cut -f1)MB"
          fi

      # Saved on failure too: a failed build or push still leaves hours of
      # compile output that the next run should not redo.
      - name: Save Bazel disk cache
        if: ${{ !cancelled() && steps.disk-cache.outcome == 'success' && steps.disk-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /mnt/bazel-disk-cache
          key: ${{ steps.disk-cache.outputs.cache-primary-key }}

  # Roll the published image over a three node cluster, one node at a time, on
  # the same data volumes. The baseline defaults to the dedup build currently
  # deployed (stock v26.2.x plus this feature, before the zstd workspace and
  # incremental sweep work),
  # so the run exercises the upgrade that actually happens: same 52-slot
  # topic_properties at version 17 and the same dedup.snapshot layout, with
  # the index carried across the node replacements. Bump the default when the
  # deployed build moves; set it empty for the public v26.2.x baseline, which
  # proves the legacy_wire slots but skips the dedup leg.
  upgrade:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/upgrade-test.yml
    with:
      slim_image: ${{ needs.build.outputs.image_ref }}
      stock_image: ${{ inputs.stock_image }}

  # Every dedup scenario against real clusters of the published image, and
  # the upgrade, downgrade and mixed-version legs against the same baseline
  # the upgrade test rolls from.
  dedup-acceptance:
    needs: build
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/dedup-acceptance.yml
    with:
      image: ${{ needs.build.outputs.image_ref }}
      old_image: ${{ inputs.stock_image }}
