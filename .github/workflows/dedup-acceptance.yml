---
# Black-box acceptance tests for produce-time deduplication: real multi-node
# clusters of the image under test, driven through the Kafka API, the admin
# API and metrics. See tests/dedup_acceptance/README.md.
name: dedup-acceptance
on:
  workflow_call:
    inputs:
      image:
        description: 'Image under test'
        required: true
        type: string
      old_image:
        description: 'Earlier dedup build for the upgrade, downgrade and mixed-version tests (empty skips them)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: 'Image under test'
        required: true
        type: string
      old_image:
        description: 'Earlier dedup build for the upgrade, downgrade and mixed-version tests (empty skips them)'
        required: false
        type: string
        default: 'ghcr.io/dream-faster/redpanda:085657d38360db6808462a096274b4aabb23b1df'

concurrency:
  group: dedup-acceptance-${{ github.ref }}-${{ inputs.image }}
  cancel-in-progress: true

jobs:
  acceptance:
    # Clusters of up to four brokers run side by side with the producers.
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images
        env:
          IMAGE: ${{ inputs.image }}
          OLD_IMAGE: ${{ inputs.old_image }}
        run: |
          docker pull "$IMAGE"
          if [[ -n "$OLD_IMAGE" ]]; then docker pull "$OLD_IMAGE"; fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/dedup_acceptance/requirements.txt

      - run: pip install -r tests/dedup_acceptance/requirements.txt

      - name: Run the acceptance suite
        env:
          DEDUP_IMAGE: ${{ inputs.image }}
          DEDUP_OLD_IMAGE: ${{ inputs.old_image }}
          # A feature the image is expected to have must fail, not skip.
          DEDUP_REQUIRE_NEW_BUILD: '1'
          DEDUP_KEEP_CLUSTERS: '1'
        working-directory: tests/dedup_acceptance
        run: |
          python -m pytest -v --junitxml="$RUNNER_TEMP/dedup-acceptance.xml"

      - name: Collect broker logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/broker-logs"
          for d in /tmp/dedup-acc-*; do
            [[ -d "$d" ]] || continue
            find "$d" -name '*.log' -maxdepth 2 -exec cp --parents {} "$RUNNER_TEMP/broker-logs" \; || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dedup-acceptance-results
          path: |
            ${{ runner.temp }}/dedup-acceptance.xml
            ${{ runner.temp }}/broker-logs
          if-no-files-found: ignore
