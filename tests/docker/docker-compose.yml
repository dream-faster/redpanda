version: '3'

networks:
  redpanda-test:
    name: redpanda-test
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.215.0/24

services:
  dns:
    restart: always
    build: ./dns
    volumes:
      - ./dns/dnsmasq.conf:/etc/dnsmasq.conf
    cap_add:
      - NET_ADMIN
    networks:
      redpanda-test:
        ipv4_address: 192.168.215.126
  rp:
    image: ${RP_TEST_NODE_IMAGE:-vectorized/redpanda-test-node}
    privileged: true
    pids_limit: 32768
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    sysctls:
      net.ipv4.ip_local_port_range: 34000 60999
    volumes:
    - '${BUILD_ROOT}:${BUILD_ROOT}'
    - '${BUILD_ROOT}/redpanda_installs:/opt/redpanda_installs'
    networks:
    - redpanda-test
    dns:
      - 192.168.215.126
